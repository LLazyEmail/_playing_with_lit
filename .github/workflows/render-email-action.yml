name: Render email action

# Consumer of LLazyEmail/email-template-workflows@v1.
# Lit render scripts do not read --input/--output (email-template-workflows#21),
# so each matrix row uses command mode and indexes generated/.
# pr-comment is false: fifteen jobs would otherwise overwrite one comment.
# .npmrc reads GITHUB_TOKEN for @llazyemail packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render ${{ matrix.template }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: hackernoon
            script: render:hackernoon
          - template: nomoretogo
            script: render:nomoretogo
          - template: mailchimp
            script: render:mailchimp
          - template: zurb
            script: render:zurb
          - template: google
            script: render:google
          - template: mysterium
            script: render:mysterium
          - template: flat-file-7
            script: render:flat-file-7
          - template: shirt1
            script: render:shirt1
          - template: shirt2
            script: render:shirt2
          - template: shirt3
            script: render:shirt3
          - template: shirt4
            script: render:shirt4
          - template: shirt5
            script: render:shirt5
          - template: lottie
            script: render:lottie
          - template: claude
            script: render:claude
          - template: good-news
            script: render:good-news
    steps:
      - uses: actions/checkout@v7

      - uses: LLazyEmail/email-template-workflows@v1
        with:
          working-directory: .
          command: npm run ${{ matrix.script }}
          artifact-directory: generated
          artifact-name: action-rendered-${{ matrix.template }}
          pr-comment: false
