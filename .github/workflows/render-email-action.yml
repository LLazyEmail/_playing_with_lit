name: Render email action

# Consumer of LLazyEmail/email-template-workflows@v2.0.0.
# Each row uses the action flags: build-script, input, output.
# Every row runs the shared CLI via its npm script (--template is in the script).
# --output is honored. --input is a payload only when it is a .json file;
# otherwise the catalog sample (or campaign override) is used.
# pr-comment is false: fifteen jobs would otherwise overwrite one comment.
# .npmrc reads GITHUB_TOKEN for @llazyemail packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render ${{ matrix.template }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: hackernoon
            script: render:hackernoon
            input: scripts/render.ts
            output: generated/hackernoon-email.html
          - template: nomoretogo
            script: render:nomoretogo
            input: scripts/render.ts
            output: generated/nomoretogo-email.html
          - template: mailchimp
            script: render:mailchimp
            input: scripts/render.ts
            output: generated/mailchimp-email.html
          - template: zurb
            script: render:zurb
            input: scripts/render.ts
            output: generated/zurb-email.html
          - template: google
            script: render:google
            input: scripts/render.ts
            output: generated/google-email.html
          - template: mysterium
            script: render:mysterium
            input: scripts/render.ts
            output: generated/mysterium-email.html
          - template: flat-file-7
            script: render:flat-file-7
            input: scripts/render.ts
            output: generated/flat-file-7-email.html
          - template: shirt1
            script: render:shirt1
            input: scripts/render.ts
            output: generated/shirt1-email.html
          - template: shirt2
            script: render:shirt2
            input: scripts/render.ts
            output: generated/shirt2-email.html
          - template: shirt3
            script: render:shirt3
            input: scripts/render.ts
            output: generated/shirt3-email.html
          - template: shirt4
            script: render:shirt4
            input: scripts/render.ts
            output: generated/shirt4-email.html
          - template: shirt5
            script: render:shirt5
            input: scripts/render.ts
            output: generated/shirt5-email.html
          - template: lottie
            script: render:lottie
            input: scripts/render.ts
            output: generated/lottie-email.html
          - template: claude
            script: render:claude
            input: scripts/render.ts
            output: generated/claude-email.html
          - template: good-news
            script: render:good-news
            input: scripts/render.ts
            output: generated/good-news-email.html
    steps:
      - uses: actions/checkout@v7

      - uses: LLazyEmail/email-template-workflows@v2.0.0
        with:
          working-directory: .
          package-manager: npm
          input: ${{ matrix.input }}
          output: ${{ matrix.output }}
          build-script: ${{ matrix.script }}
          validate-script: ""
          artifact-directory: generated
          artifact-name: action-rendered-${{ matrix.template }}
          pr-comment: false
          job-summary: true