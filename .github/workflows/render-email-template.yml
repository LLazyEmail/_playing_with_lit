name: Render Email Template

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    name: Generate HTML email artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render No More To-Go email template
        run: npm run render:template

      - name: Render Hacker Noon email template
        run: npm run render:hackernoon

      - name: Upload rendered HTML as artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-email-html
          path: |
            generated/nomoretogo-email.html
            generated/hackernoon-email.html
          if-no-files-found: error
