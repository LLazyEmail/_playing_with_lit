name: Render Email Template

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    name: Generate HTML email artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # npm ci requires package.json and package-lock.json to match.
      # markup-generator was added to package.json without a lockfile update,
      # so install with npm install until the regenerated lock is committed.
      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run unit and snapshot tests
        run: npm test

      - name: Render No More To-Go email template (minified)
        run: npm run render:template:minify

      - name: Render Hacker Noon email template (minified)
        run: npm run render:hackernoon:minify

      - name: Upload rendered HTML as artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-email-html
          path: |
            generated/nomoretogo-email.html
            generated/hackernoon-email.html
          if-no-files-found: error
